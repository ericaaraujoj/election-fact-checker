<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Election Fact Checker</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>🔎 Election Fact Checker</h1>

        <p class="subtitle">
            Verificação inteligente de informações eleitorais
        </p>

        <textarea
            id="inputText"
            placeholder="Digite uma afirmação ou notícia..."
        ></textarea>

        <button id="btnVerificar" type="button">
            Verificar Informação
        </button>

        <div id="resultado" class="resultado hidden"></div>

    </div>

    <script src="app.js"></script>

</body>
</html>
